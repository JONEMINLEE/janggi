      sdk.on("resume", function () {});
      sdk.on("exit", function () {});

        .then(function (info) {
          if (info && info.err) return; // 일반 브라우저 등 미지원 환경
          sdk.setLoadingProgress(100);
          return sdk.startGameAsync();
        })
        .catch(function (e) { console.warn("ONE store SDK", e && e.reason, e && e.message); });
